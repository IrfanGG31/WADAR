services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wadar
      POSTGRES_PASSWORD: wadar
      POSTGRES_DB: wadar
    ports:
      # Bound to loopback only — Postgres has no business being reachable
      # from outside the host. Apps connect via DATABASE_URL=...@localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      - wadar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Same reasoning as postgres above — loopback only.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wadar_postgres_data:
